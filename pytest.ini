[pytest]
testpaths = tests
addopts = -q

# Warnings are errors by default. A DeprecationWarning from our own code is how
# a silent behaviour change announces itself, and letting it scroll past in a
# green run is how it gets missed.
#
# The two exceptions are third-party notices we cannot switch off at the source,
# each with a reason for being safe to ignore:
#
#   LightGBM/TreeExplainer output shape - shap warns that binary classifiers now
#   return a list. Both shapes are handled, and the handling is verified against
#   the model's own raw margin to 1e-14 by
#   test_shap_values_reconstruct_the_model_margin.
#
#   Feature names - sklearn notes that a numpy array carries no column names.
#   Columns are addressed by index throughout, from column_index_in_cache.
filterwarnings =
    error
    ignore:LightGBM binary classifier with TreeExplainer:UserWarning
    ignore:X does not have valid feature names:UserWarning
